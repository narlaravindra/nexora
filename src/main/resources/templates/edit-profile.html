<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nexora - Edit Profile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef0f5; }
        .navbar { background: linear-gradient(135deg, #6c63ff, #48c6ef); padding: 14px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .navbar h1 { color: white; font-size: 24px; }
        .navbar-right { display: flex; gap: 16px; }
        .navbar a { color: white; text-decoration: none; font-size: 14px; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.5); }
        .container { max-width: 520px; margin: 32px auto; padding: 0 16px; }
        .card { background: white; border-radius: 16px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
        .avatar-section { text-align: center; margin-bottom: 24px; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, #6c63ff, #48c6ef); color: white; font-size: 36px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .photo-label { display: inline-block; padding: 8px 20px; background: #eef0f5; border-radius: 20px; font-size: 13px; color: #6c63ff; cursor: pointer; }
        .photo-label:hover { background: #e0e2f0; }
        input[type="file"] { display: none; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; font-weight: 500; }
        input[type="text"], textarea { width: 100%; padding: 12px 16px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 14px; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #6c63ff; }
        textarea { height: 100px; resize: none; }
        .btn-save { width: 100%; padding: 14px; background: linear-gradient(135deg, #6c63ff, #48c6ef); color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; margin-top: 8px; }
        .username-badge { color: #6c63ff; font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    </style>
</head>
<body>
<div class="navbar">
    <h1>🌌 Nexora</h1>
    <div class="navbar-right">
        <a href="/feed">Feed</a>
        <a th:href="'/profile/' + ${username}">My Profile</a>
    </div>
</div>
<div class="container">
    <div class="card">
        <form method="post" action="/edit-profile" enctype="multipart/form-data">
            <div class="avatar-section">
                <div class="avatar">
                    <img th:if="${user.photo != null}" th:src="${user.photo}" alt="photo"/>
                    <span th:if="${user.photo == null}" th:text="${username.substring(0,1).toUpperCase()}"></span>
                </div>
                <div class="username-badge" th:text="'@' + ${username}"></div>
                <label class="photo-label" for="photo">📸 Change Photo</label>
                <input type="file" id="photo" name="photo" accept="image/*"/>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name"
                       th:value="${user.full_name}"
                       placeholder="Your full name" />
            </div>
            <div class="form-group">
                <label>Bio</label>
                <textarea name="bio"
                          th:text="${user.bio}"
                          placeholder="Tell people about yourself..."></textarea>
            </div>
            <button class="btn-save" type="submit">Save Profile</button>
        </form>
    </div>
</div>
</body>
</html>
