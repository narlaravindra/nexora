<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nexora - Verify Mobile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0c29; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; text-align: center; }
        .logo { font-size: 28px; font-weight: 800; color: white; letter-spacing: 2px; margin-bottom: 8px; }
        .logo span { color: #a78bfa; }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 8px; }
        .mobile-hint { color: #a78bfa; font-size: 16px; font-weight: 600; margin-bottom: 24px; }
        .otp-display { background: rgba(167,139,250,0.1); border: 2px solid #a78bfa; border-radius: 12px; padding: 16px; margin-bottom: 24px; }
        .otp-label { color: #94a3b8; font-size: 12px; margin-bottom: 8px; }
        .otp-code { color: #a78bfa; font-size: 32px; font-weight: 800; letter-spacing: 8px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; text-align: left; text-transform: uppercase; }
        input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; font-size: 20px; color: white; text-align: center; letter-spacing: 8px; margin-bottom: 16px; }
        input:focus { outline: none; border-color: #a78bfa; }
        .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, #a78bfa, #60a5fa); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .error { color: #f87171; font-size: 13px; margin-bottom: 16px; background: rgba(248,113,113,0.1); padding: 10px; border-radius: 8px; }
        .link { margin-top: 20px; font-size: 14px; color: #64748b; }
        .link a { color: #a78bfa; text-decoration: none; }
        .note { color: #475569; font-size: 12px; margin-top: 16px; }
    </style>
</head>
<body>
<div class="box">
    <div class="logo">NEX<span>ORA</span></div>
    <div class="subtitle">Verify your mobile number</div>
    <div class="mobile-hint" th:text="'+91 ' + ${mobile}"></div>

    <div class="otp-display">
        <div class="otp-label">Your OTP Code (Demo)</div>
        <div class="otp-code" th:text="${otp}"></div>
    </div>

    <p th:if="${error}" class="error" th:text="${error}"></p>

    <form method="post" action="/verify-mobile">
        <input type="hidden" name="mobile" th:value="${mobile}"/>
        <label>Enter OTP</label>
        <input type="text" name="otp" placeholder="000000" maxlength="6" required autofocus/>
        <button class="btn-primary" type="submit">Verify →</button>
    </form>

    <div class="note">⚠️ SMS integration coming soon. OTP shown above for demo.</div>
    <div class="link"><a href="/register">← Back to Register</a></div>
</div>
</body>
</html>
