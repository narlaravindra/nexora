<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nexora - Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0c29; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; }
        .logo { text-align: center; font-size: 28px; font-weight: 800; color: white; letter-spacing: 2px; margin-bottom: 8px; }
        .logo span { color: #a78bfa; }
        .subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 13px 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; font-size: 15px; color: white; transition: 0.3s; }
        input::placeholder { color: #475569; }
        input:focus { outline: none; border-color: #a78bfa; background: rgba(167,139,250,0.1); }
        .hint { font-size: 11px; color: #475569; margin-top: 5px; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #a78bfa, #60a5fa); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: 0.3s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .error { color: #f87171; text-align: center; font-size: 13px; margin-bottom: 16px; background: rgba(248,113,113,0.1); padding: 10px; border-radius: 8px; }
        .link { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
        .link a { color: #a78bfa; text-decoration: none; }
    </style>
</head>
<body>
<div class="box">
    <div class="logo">NEX<span>ORA</span></div>
    <div class="subtitle">Create your account</div>
    <p th:if="${error}" class="error" th:text="${error}"></p>
    <form method="post" action="/register-auto">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a username" required/>
        </div>
        <div class="form-group">
            <label>Email or Mobile Number</label>
            <input type="text" name="identifier" placeholder="abc@gmail.com or 9876543210" required/>
            <div class="hint">Enter email address or 10-digit mobile number</div>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Min 8 characters" required/>
        </div>
        <button class="btn" type="submit">Create Account →</button>
    </form>
    <div class="link">Already have an account? <a href="/login">Sign In</a></div>
</div>
</body>
</html>
