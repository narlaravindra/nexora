<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nexora - Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0c29; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; }
        .logo { text-align: center; font-size: 28px; font-weight: 800; color: white; letter-spacing: 2px; margin-bottom: 8px; }
        .logo span { color: #a78bfa; }
        .subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; font-size: 14px; color: white; transition: 0.3s; }
        input::placeholder { color: #475569; }
        input:focus { outline: none; border-color: #a78bfa; background: rgba(167,139,250,0.1); }
        .phone-input { display: flex; gap: 8px; }
        .phone-code { width: 80px; flex-shrink: 0; }
        .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, #a78bfa, #60a5fa); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: 0.3s; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .error { color: #f87171; text-align: center; font-size: 13px; margin-bottom: 16px; background: rgba(248,113,113,0.1); padding: 10px; border-radius: 8px; }
        .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
        .divider hr { flex: 1; border: none; border-top: 1px solid rgba(255,255,255,0.1); }
        .divider span { color: #475569; font-size: 12px; }
        .link { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
        .link a { color: #a78bfa; text-decoration: none; }
        .link a:hover { text-decoration: underline; }
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .tab { flex: 1; padding: 10px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #64748b; font-size: 13px; cursor: pointer; text-align: center; transition: 0.3s; background: none; }
        .tab.active { border-color: #a78bfa; color: #a78bfa; background: rgba(167,139,250,0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
<div class="box">
    <div class="logo">NEX<span>ORA</span></div>
    <div class="subtitle">Create your account</div>

    <p th:if="${error}" class="error" th:text="${error}"></p>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('email')">📧 Email</button>
        <button class="tab" onclick="switchTab('mobile')">📱 Mobile</button>
    </div>

    <div id="email-tab" class="tab-content active">
        <form method="post" action="/register">
            <input type="hidden" name="type" value="email"/>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a username" required/>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="your@email.com" required/>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Min 8 characters" required/>
            </div>
            <button class="btn-primary" type="submit">Create Account →</button>
        </form>
    </div>

    <div id="mobile-tab" class="tab-content">
        <form method="post" action="/register-mobile">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a username" required/>
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <div class="phone-input">
                    <input class="phone-code" type="text" value="+91" readonly/>
                    <input type="tel" name="mobile" placeholder="10 digit number" maxlength="10" required/>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Min 8 characters" required/>
            </div>
            <button class="btn-primary" type="submit">Send OTP →</button>
        </form>
    </div>

    <div class="link">Already have an account? <a href="/login">Sign In</a></div>
</div>
<script>
function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById(tab + '-tab').classList.add('active');
    event.target.classList.add('active');
}
</script>
</body>
</html>
