<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nexora - Messages</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0c29; min-height: 100vh; }
        .navbar { background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { color: white; font-size: 22px; font-weight: 800; letter-spacing: 2px; text-decoration: none; }
        .logo span { color: #a78bfa; }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a { color: #94a3b8; text-decoration: none; font-size: 13px; padding: 8px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .nav-links a:hover { background: rgba(255,255,255,0.1); color: white; }
        .container { max-width: 600px; margin: 24px auto; padding: 0 16px; }
        .page-title { color: white; font-size: 20px; font-weight: 700; margin-bottom: 16px; }
        .conv-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; text-decoration: none; transition: 0.2s; }
        .conv-card:hover { background: rgba(167,139,250,0.1); border-color: rgba(167,139,250,0.3); }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #a78bfa, #60a5fa); color: white; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .conv-info { flex: 1; }
        .conv-name { color: white; font-size: 15px; font-weight: 600; }
        .conv-last { color: #64748b; font-size: 13px; margin-top: 2px; }
        .empty { text-align: center; color: #475569; padding: 60px 20px; font-size: 15px; }
        .new-msg { background: linear-gradient(135deg, #a78bfa, #60a5fa); color: white; border: none; border-radius: 20px; padding: 10px 20px; font-size: 14px; cursor: pointer; margin-bottom: 16px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
<div class="navbar">
    <a href="/feed" class="logo">NEX<span>ORA</span></a>
    <div class="nav-links">
        <a href="/feed">Feed</a>
        <a href="/notifications">🔔 Notifications</a>
        <a th:href="'/profile/' + ${username}">Profile</a>
    </div>
</div>
<div class="container">
    <div class="page-title">💬 Messages</div>
    <div th:if="${conversations.isEmpty()}" class="empty">
        No messages yet! Search for users and start chatting.
    </div>
    <a th:each="conv : ${conversations}"
       th:href="'/messages/' + ${conv.username}"
       class="conv-card">
        <div class="avatar">
            <img th:if="${conv.photo != null}" th:src="${conv.photo}" alt="avatar"/>
            <span th:if="${conv.photo == null}" th:text="${conv.username.substring(0,1).toUpperCase()}"></span>
        </div>
        <div class="conv-info">
            <div class="conv-name" th:text="'@' + ${conv.username}"></div>
            <div class="conv-last" th:text="${conv.last_message}"></div>
        </div>
    </a>
</div>
</body>
</html>
