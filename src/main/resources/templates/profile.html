<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nexora - Profile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef0f5; }
        .navbar { background: linear-gradient(135deg, #6c63ff, #48c6ef); padding: 14px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .navbar h1 { color: white; font-size: 24px; letter-spacing: 1px; }
        .navbar-right { display: flex; gap: 16px; }
        .navbar a { color: white; text-decoration: none; font-size: 14px; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.5); }
        .navbar a:hover { background: rgba(255,255,255,0.2); }
        .container { max-width: 620px; margin: 32px auto; padding: 0 16px; }
        .profile-card { background: white; border-radius: 16px; padding: 36px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); text-align: center; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, #6c63ff, #48c6ef); color: white; font-size: 36px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .full-name { font-size: 20px; font-weight: 700; color: #333; margin-bottom: 4px; }
        .profile-name { font-size: 15px; color: #888; margin-bottom: 12px; }
        .bio { font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.6; }
        .profile-stats { display: flex; justify-content: center; gap: 48px; margin-bottom: 20px; }
        .stat-number { font-size: 24px; font-weight: 700; color: #6c63ff; }
        .stat-label { font-size: 13px; color: #aaa; margin-top: 2px; }
        .btn-follow { padding: 10px 32px; background: linear-gradient(135deg, #6c63ff, #48c6ef); color: white; border: none; border-radius: 20px; font-size: 15px; cursor: pointer; }
        .btn-unfollow { padding: 10px 32px; background: white; color: #6c63ff; border: 2px solid #6c63ff; border-radius: 20px; font-size: 15px; cursor: pointer; }
        .btn-edit { padding: 10px 32px; background: white; color: #6c63ff; border: 2px solid #6c63ff; border-radius: 20px; font-size: 15px; text-decoration: none; display: inline-block; }
        .btn-edit:hover { background: #f0eeff; }
        .post-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
        .post-content { font-size: 15px; color: #333; line-height: 1.6; margin-bottom: 12px; }
        .post-footer { display: flex; justify-content: space-between; }
        .post-time { font-size: 12px; color: #bbb; }
        .like-count { font-size: 13px; color: #6c63ff; font-weight: 500; }
        .empty { text-align: center; color: #bbb; margin-top: 20px; }
    </style>
</head>
<body>
<div class="navbar">
    <h1>🌌 Nexora</h1>
    <div class="navbar-right">
        <a href="/feed">Feed</a>
        <a href="/search">🔍 Search</a>
        <a href="/logout">Logout</a>
    </div>
</div>
<div class="container">
    <div class="profile-card">
        <div class="avatar">
        <img th:if="${photo != null}" th:src="${photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="photo"/>
        <span th:if="${photo == null}" th:text="${profileUser.substring(0,1).toUpperCase()}"></span>
        </div>
        <div class="full-name" th:if="${fullName != null and !fullName.isEmpty()}" th:text="${fullName}"></div>
        <div class="profile-name" th:text="'@' + ${profileUser}"></div>
        <div class="bio" th:if="${bio != null and !bio.isEmpty()}" th:text="${bio}"></div>
        <div class="profile-stats">
            <div class="stat">
                <div class="stat-number" th:text="${postCount}">0</div>
                <div class="stat-label">Posts</div>
            </div>
            <div class="stat">
                <div class="stat-number" th:text="${followers}">0</div>
                <div class="stat-label">Followers</div>
            </div>
            <div class="stat">
                <div class="stat-number" th:text="${following}">0</div>
                <div class="stat-label">Following</div>
            </div>
        </div>
        <a th:if="${isOwnProfile}" class="btn-edit" href="/edit-profile">Edit Profile</a>
        <form th:if="${!isOwnProfile}" method="post" th:action="'/follow/' + ${profileUser}">
            <button type="submit"
                    th:class="${isFollowing} ? 'btn-unfollow' : 'btn-follow'"
                    th:text="${isFollowing} ? 'Unfollow' : 'Follow'">
            </button>
        </form>
    </div>
    <div th:if="${posts.isEmpty()}" class="empty"><p>No posts yet!</p></div>
    <div th:each="post : ${posts}" class="post-card">
        <div class="post-content" th:text="${post.content}"></div>
        <div class="post-footer">
            <div class="post-time" th:text="${post.created_at}"></div>
            <div class="like-count" th:text="'♥ ' + ${post.like_count}"></div>
        </div>
    </div>
</div>
</body>
</html>
