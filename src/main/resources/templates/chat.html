<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nexora - Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0c29; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 14px 24px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
        .back { color: #a78bfa; text-decoration: none; font-size: 20px; }
        .chat-user { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #a78bfa, #60a5fa); color: white; font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-username { color: white; font-size: 15px; font-weight: 600; }
        .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; max-width: 600px; width: 100%; margin: 0 auto; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
        .msg.sent { background: linear-gradient(135deg, #a78bfa, #60a5fa); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.received { background: rgba(255,255,255,0.08); color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-time { font-size: 10px; opacity: 0.6; margin-top: 4px; }
        .input-area { background: rgba(255,255,255,0.05); border-top: 1px solid rgba(255,255,255,0.1); padding: 12px 16px; }
        .input-form { max-width: 600px; margin: 0 auto; display: flex; gap: 10px; }
        .input-form input { flex: 1; padding: 12px 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; font-size: 14px; color: white; }
        .input-form input::placeholder { color: #475569; }
        .input-form input:focus { outline: none; border-color: #a78bfa; }
        .input-form button { padding: 12px 20px; background: linear-gradient(135deg, #a78bfa, #60a5fa); color: white; border: none; border-radius: 25px; font-size: 14px; cursor: pointer; }
        .empty { text-align: center; color: #475569; padding: 40px; font-size: 14px; }
    </style>
</head>
<body>
<div class="navbar">
    <a href="/messages" class="back">←</a>
    <div class="chat-user">
        <div class="avatar">
            <img th:if="${otherUser.photo != null}" th:src="${otherUser.photo}" alt="avatar"/>
            <span th:if="${otherUser.photo == null}" th:text="${otherUser.username.toString().substring(0,1).toUpperCase()}"></span>
        </div>
        <div class="chat-username" th:text="'@' + ${otherUser.username}"></div>
    </div>
</div>
<div class="messages" id="messages">
    <div th:if="${chats.isEmpty()}" class="empty">No messages yet. Say hello! 👋</div>
    <div th:each="chat : ${chats}"
         th:class="${chat.sender_id == userId} ? 'msg sent' : 'msg received'">
        <div th:text="${chat.content}"></div>
        <div class="msg-time" th:text="${chat.created_at}"></div>
    </div>
</div>
<div class="input-area">
    <form class="input-form" method="post" th:action="'/messages/' + ${otherUser.username}">
        <input type="text" name="content" placeholder="Type a message..." required autofocus/>
        <button type="submit">Send</button>
    </form>
</div>
<script>
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
</script>
</body>
</html>
