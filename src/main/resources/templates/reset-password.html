<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nexora - Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0c29; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; }
        .logo { text-align: center; font-size: 28px; font-weight: 800; color: white; letter-spacing: 2px; margin-bottom: 8px; }
        .logo span { color: #a78bfa; }
        .subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; text-transform: uppercase; }
        input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; font-size: 14px; color: white; }
        input::placeholder { color: #475569; }
        input:focus { outline: none; border-color: #a78bfa; }
        .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, #a78bfa, #60a5fa); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .error { color: #f87171; text-align: center; font-size: 13px; margin-bottom: 16px; background: rgba(248,113,113,0.1); padding: 10px; border-radius: 8px; }
        .link { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
        .link a { color: #a78bfa; text-decoration: none; }
    </style>
</head>
<body>
<div class="box">
    <div class="logo">NEX<span>ORA</span></div>
    <div class="subtitle">Enter OTP and new password</div>

    <p th:if="${error}" class="error" th:text="${error}"></p>

    <form method="post" action="/reset-password">
        <input type="hidden" name="email" th:value="${email}"/>
        <div class="form-group">
            <label>OTP Code</label>
            <input type="text" name="otp" placeholder="Enter 6-digit OTP" maxlength="6" required/>
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="newPassword" placeholder="Min 8 characters" required/>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirmPassword" placeholder="Repeat new password" required/>
        </div>
        <button class="btn-primary" type="submit">Reset Password →</button>
    </form>

    <div class="link"><a href="/login">← Back to Login</a></div>
</div>
</body>
</html>
